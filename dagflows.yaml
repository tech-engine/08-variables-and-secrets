# A workspace of several projects, built and deployed as one workflow.
v: 1

# The project that owns the workflow's settings must declare this same name.
workflow: order-pipeline

projects:
  - path: py-orders
  - path: go-orders

  # Dagflows discovers workflow.js on its own. A TypeScript entry module is named here.
  - path: node-orders
    module: workflow.ts
